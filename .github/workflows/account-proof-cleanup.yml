name: Retire superseded account proof run
on:
  push:
    branches: [v3/account-proof]
    paths: [.github/workflows/account-proof-cleanup.yml]
permissions:
  actions: write
jobs:
  cancel-owned-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the exact superseded diagnostic experiment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39006181611" --jq '[.head_sha, .head_branch, .status] | join(" ")')
          if [[ "$run_info" == '69d7b2daba226e88540b5fd332a8af393e3853ae v3/account-proof in_progress' ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/39006181611/cancel"
          fi
