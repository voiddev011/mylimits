name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Core tests, type checking and extension build
        run: npm run check
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Package extension
        run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: mylimits-chrome
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          include-hidden-files: true

  windows-logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - name: Parse Windows scripts and construct setup GUI without installing
        shell: powershell
        run: ./scripts/test-windows-setup.ps1
      - name: Install NSIS compiler
        run: choco install nsis --no-progress -y
      - name: Package unsigned optional Windows companion
        run: npm run package:companion
      - uses: actions/upload-artifact@v4
        with:
          name: mylimits-companion-windows-unsigned
          path: |
            artifacts/mylimits-companion-windows-unsigned.exe
            artifacts/mylimits-companion-windows-unsigned.exe.sha256
          if-no-files-found: error
