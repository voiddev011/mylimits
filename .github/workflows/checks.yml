name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install extension dependencies
        run: npm ci
      - name: Core tests and extension build
        run: npm run check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Core tests, type checking and extension build
        run: npm run check
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Isolated spike build and redaction fixtures (no provider traffic)
        run: npm run test:spike
      - name: Package separate evidence spike
        run: npm run zip:spike
      - uses: actions/upload-artifact@v4
        with:
          name: mylimits-evidence-spike-not-for-release
          path: .output-spike/*.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Browser variant builds and package contracts
        run: |
          npm run build:edge
          npm run build:firefox
          node scripts/check-packages.mjs
      - name: Package extension variants
        run: |
          npm run zip
          npm run zip:firefox
          node scripts/package-checksums.mjs
          python scripts/check-archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: mylimits-extension-packages
          path: |
            .output/*.zip
            .output/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          include-hidden-files: true
